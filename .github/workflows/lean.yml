# Checks the formal proofs in lean/ on every push to main and every pull request: builds
# them against Mathlib, compares their axioms with lean/axioms.expected, and replays each file in Lean's kernel
# with leanchecker.
name: lean

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lean:
    name: Lean proofs
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@v4
      # Mathlib's prebuilt files take several GB: make room on the runner first.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /
      - name: Install Lean, fetch Mathlib's prebuilt files, build every proof
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: lean
          auto-config: false
          build: true
          use-mathlib-cache: true
          # Saving .lake (Mathlib's files) to GitHub's cache filled the runner's disk.
          use-github-cache: false
      - name: Compare the axioms with axioms.expected
        run: lake env lean PrintAxioms.lean > axioms.txt && diff axioms.expected axioms.txt
      - name: Replay each file in the kernel
        run: for m in LocalColouring Q23 Q311 QuadraticPlanes Sqrt11 Sqrt119 Sqrt131 Sqrt179 Sqrt191 Sqrt251 Sqrt431 Sqrt455 Sqrt911 Sqrt935 ColouringFormula Sqrt23 Sqrt35 Sqrt47 Sqrt59 Sqrt71 Sqrt95 Sqrt155 Sqrt239 Sqrt263 Sqrt359 Sqrt443 Sqrt491 Sqrt599 Sqrt611 Sqrt791 Sqrt851 Sqrt959 PadicPlanes TheoremW Recurrence TheoremWplus DistLiu TheoremWInf FourColours PadicFour TwoRoots; do lake env leanchecker -v "$m"; done
