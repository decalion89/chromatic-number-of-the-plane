# Runs the fast part of research/hadwiger-nelson/tests on every push to main and every pull request.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fast-tests:
    name: Fast test suite
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: research/hadwiger-nelson
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: research/hadwiger-nelson/requirements.txt
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      # The full suite takes hours (it re-solves de Grey's graph); CI runs the files that finish
      # in seconds, which cover the field arithmetic, the local colourings and both theorems.
      - name: Run the fast tests
        run: >-
          python -m pytest -q
          tests/test_q23.py tests/test_q311.py tests/test_q35.py tests/test_moser_field.py tests/test_reduce11.py
          tests/test_field.py tests/test_geometry.py tests/test_graph_coloring.py tests/test_certify.py
          tests/test_density.py tests/test_quadext.py tests/test_spindle.py tests/test_transfer.py
          tests/test_cyclotomic.py tests/test_disjunctive_spindle.py tests/test_slack.py tests/test_mu.py
          tests/test_ring_geometry.py tests/test_tight_four.py tests/test_fast_agrees.py
          tests/test_neighbourhoods_are_bipartite.py tests/test_kappa.py tests/test_transversal.py
          tests/test_forced.py tests/test_multispindle.py tests/test_mixed.py
