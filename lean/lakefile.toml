name = "HadwigerNelson"
version = "0.1.0"
defaultTargets = ["LocalColouring", "Q23", "Q311", "QuadraticPlanes", "Sqrt11", "Sqrt119", "Sqrt131", "Sqrt179", "Sqrt191", "Sqrt251", "Sqrt431", "Sqrt455", "Sqrt911", "Sqrt935", "ColouringFormula", "Sqrt23", "Sqrt35", "Sqrt47", "Sqrt59", "Sqrt71", "Sqrt95", "Sqrt155", "Sqrt239", "Sqrt263", "Sqrt359", "Sqrt443", "Sqrt491", "Sqrt599", "Sqrt611", "Sqrt791", "Sqrt851", "Sqrt959", "PadicPlanes", "TheoremW", "Recurrence", "TheoremWplus", "DistLiu", "TheoremWInf", "FourColours", "PadicFour", "TwoRoots", "PlaneSeven"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.1"

# The criterion at 2 for fields containing √3, and the tools the fields share.
[[lean_lib]]
name = "LocalColouring"

# χ(ℚ(√2, √3)²) = 4.
[[lean_lib]]
name = "Q23"

# χ(ℚ(√3, √11)²) = 4 (K. G. Fischer, 1994).
[[lean_lib]]
name = "Q311"

# The real quadratic fields: the upper bounds (reductions at 7 and at 2) and the tools for the lower bounds.
[[lean_lib]]
name = "QuadraticPlanes"

# χ(ℚ(√11)²) = 4 (11 ≡ 2² (mod 7): the reduction at 7).
[[lean_lib]]
name = "Sqrt11"

# χ(ℚ(√119)²) = 4 (119 = 7 · 17: the reduction at 7, ramified).
[[lean_lib]]
name = "Sqrt119"

# χ(ℚ(√131)²) = 4 (131 ≡ 3 (mod 8): the reduction at 2).
[[lean_lib]]
name = "Sqrt131"

# χ(ℚ(√179)²) = 4 (179 ≡ 2² (mod 7): the reduction at 7).
[[lean_lib]]
name = "Sqrt179"

# χ(ℚ(√191)²) = 4 (191 ≡ 3² (mod 7): the reduction at 7).
[[lean_lib]]
name = "Sqrt191"

# χ(ℚ(√251)²) = 4 (251 ≡ 3 (mod 8): the reduction at 2).
[[lean_lib]]
name = "Sqrt251"

# χ(ℚ(√431)²) = 4 (431 ≡ 2² (mod 7): the reduction at 7).
[[lean_lib]]
name = "Sqrt431"

# χ(ℚ(√455)²) = 4 (455 = 7 · 65: the reduction at 7, ramified).
[[lean_lib]]
name = "Sqrt455"

# χ(ℚ(√911)²) = 4 (911 ≡ 1² (mod 7): the reduction at 7).
[[lean_lib]]
name = "Sqrt911"

# χ(ℚ(√935)²) = 4 (935 ≡ 2² (mod 7): the reduction at 7).
[[lean_lib]]
name = "Sqrt935"

# The colouring formula as a Lean object, and the lower bound from its unsatisfiability.
[[lean_lib]]
name = "ColouringFormula"

# χ(ℚ(√23)²) = 4 if q23.cnf is unsatisfiable (23 ≡ 3² (mod 7): the reduction at 7).
[[lean_lib]]
name = "Sqrt23"

# χ(ℚ(√35)²) = 4 if q35.cnf is unsatisfiable (35 = 7 · 5: the reduction at 7, ramified).
[[lean_lib]]
name = "Sqrt35"

# χ(ℚ(√47)²) ≥ 4 if q47.cnf is unsatisfiable.
[[lean_lib]]
name = "Sqrt47"

# χ(ℚ(√59)²) = 4 if q59.cnf is unsatisfiable (59 ≡ 3 (mod 8): the reduction at 2).
[[lean_lib]]
name = "Sqrt59"

# χ(ℚ(√71)²) = 4 if q71.cnf is unsatisfiable (71 ≡ 1² (mod 7): the reduction at 7).
[[lean_lib]]
name = "Sqrt71"

# χ(ℚ(√95)²) = 4 if q95.cnf is unsatisfiable (95 ≡ 2² (mod 7): the reduction at 7).
[[lean_lib]]
name = "Sqrt95"

# χ(ℚ(√155)²) = 4 if q155.cnf is unsatisfiable (155 ≡ 1² (mod 7): the reduction at 7).
[[lean_lib]]
name = "Sqrt155"

# χ(ℚ(√239)²) = 4 if q239.cnf is unsatisfiable (239 ≡ 1² (mod 7): the reduction at 7).
[[lean_lib]]
name = "Sqrt239"

# χ(ℚ(√263)²) = 4 if q263.cnf is unsatisfiable (263 ≡ 2² (mod 7): the reduction at 7).
[[lean_lib]]
name = "Sqrt263"

# χ(ℚ(√359)²) = 4 if q359.cnf is unsatisfiable (359 ≡ 3² (mod 7): the reduction at 7).
[[lean_lib]]
name = "Sqrt359"

# χ(ℚ(√443)²) = 4 if q443.cnf is unsatisfiable (443 ≡ 3² (mod 7): the reduction at 7).
[[lean_lib]]
name = "Sqrt443"

# χ(ℚ(√491)²) = 4 if q491.cnf is unsatisfiable (491 ≡ 1 (mod 7): the reduction at 7).
[[lean_lib]]
name = "Sqrt491"

# χ(ℚ(√599)²) = 4 if q599.cnf is unsatisfiable (599 ≡ 2² (mod 7): the reduction at 7).
[[lean_lib]]
name = "Sqrt599"

# χ(ℚ(√611)²) = 4 if q611.cnf is unsatisfiable (611 ≡ 3² (mod 7): the reduction at 7).
[[lean_lib]]
name = "Sqrt611"

# χ(ℚ(√791)²) = 4 if q791.cnf is unsatisfiable (791 = 7 · 113: the reduction at 7, ramified).
[[lean_lib]]
name = "Sqrt791"

# χ(ℚ(√851)²) = 4 if q851.cnf is unsatisfiable (851 ≡ 2² (mod 7): the reduction at 7).
[[lean_lib]]
name = "Sqrt851"

# χ(ℚ(√959)²) = 4 if q959.cnf is unsatisfiable (959 = 7 · 137: the reduction at 7, ramified).
[[lean_lib]]
name = "Sqrt959"

# χ(ℚ₇²) = 4, χ(ℚ₃²) = 3 and χ(ℚ₂²) = 2 for the graph of x² + y² = 1 over the p-adic numbers.
[[lean_lib]]
name = "PadicPlanes"

# Theorem W for three colours and finite abelian groups: a proper 3-colouring of Cay(G, S) gives a character
# ξ of the subgroup generated by S with ξ(S) ⊆ [1/3, 2/3] (mod 1).
[[lean_lib]]
name = "TheoremW"

# Three colours of Katznelson's question: every 3-colouring of ℕ has a Bohr set {n : ‖nα‖ < 1/3} of monochromatic
# differences (Question 3 of Glasscock, Koutsogiannis and Richter), and the form for ℤ, from Theorem W.
[[lean_lib]]
name = "Recurrence"

# Theorem W for every circular clique K_{p/q} with p < 4q, finite abelian groups: a homomorphism Cay(G, S) → K_{p/q}
# gives a character ξ of the subgroup generated by S with ξ(S) ⊆ [q/p, 1 − q/p] (mod 1), and conversely.
[[lean_lib]]
name = "TheoremWplus"

# Theorem W⁺ for distance graphs G(ℤ, D), the lonely runner theorem for three speeds, and the answer to Problem 3
# of Liu's survey on distance graphs: χ_c(G(ℤ, D)) = 1/κ(D) for every set D of three positive integers.
[[lean_lib]]
name = "DistLiu"

# Theorem W for three colours, every abelian group and finite S: Følner averaging of the winding sums and a limit
# along an ultrafilter replace the average over the finite group; the same for K_{p/q}, p < 4q.
[[lean_lib]]
name = "TheoremWInf"

# χ(ℚ(√d)²) ≥ 4 for every d ≡ 11 (mod 12): for an explicit finite set U of unit vectors no character maps U into
# [1/3, 2/3] (mod 1), and Theorem W (TheoremWInf) turns a 3-colouring into such a character.
[[lean_lib]]
name = "FourColours"

# χ(ℚ_[p]²) ≥ 4 for every prime p ≥ 5 (Corollary 3 of notes/four_colours_11_mod_12.md), and the same for every
# field of characteristic 0 containing a square root of some d ≡ 11 (mod 12): the transfer, from Theorem 1.
[[lean_lib]]
name = "PadicFour"

# χ(K²) ≥ 4 for every real field K containing √a and √b with a ≡ 2 (mod 3) and b ≡ 7 (mod 8) (Proposition B9):
# the argument of FourColours with the base vectors e, u_a, ū_a, u_b, ū_b.
[[lean_lib]]
name = "TwoRoots"

# χ(ℝ²) ≤ 7 in the formulation of google-deepmind/formal-conjectures (Erdős Problem 508): a brick colouring.
[[lean_lib]]
name = "PlaneSeven"
