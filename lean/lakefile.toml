name = "HadwigerNelson"
version = "0.1.0"
defaultTargets = ["LocalColouring", "Q23", "Q311", "Q11"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "v4.34.1"

# The criterion and the tools shared by both fields.
[[lean_lib]]
name = "LocalColouring"

# χ(ℚ(√2, √3)²) = 4.
[[lean_lib]]
name = "Q23"

# χ(ℚ(√3, √11)²) = 4 (K. G. Fischer, 1994).
[[lean_lib]]
name = "Q311"

# χ(ℚ(√11)²) = 4: the first real quadratic field whose plane needs four colours.
[[lean_lib]]
name = "Q11"
